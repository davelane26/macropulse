<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="6"/>
  
  <!-- Subtle ambient ring -->
  <circle cx="256" cy="245" r="150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.12"/>
  
  <!-- MacroPulse ECG / Pulse line -->
  <path d="M 80 250 L 160 250 L 195 145 L 250 360 L 295 205 L 330 285 L 360 235 L 432 250" fill="none" stroke="url(#pulseGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Macro Color Indicator Pills: Protein, Carbs, Fat -->
  <g transform="translate(0, 400)">
    <circle cx="196" cy="0" r="14" fill="#10b981"/>
    <circle cx="256" cy="0" r="14" fill="#f59e0b"/>
    <circle cx="316" cy="0" r="14" fill="#f43f5e"/>
  </g>
</svg>
